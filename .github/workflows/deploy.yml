name: Deploy demo
on:
  push:
    branches: [test, main]
  workflow_dispatch:

jobs:
  deploy-test:
    if: github.ref_name == 'test'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - run: echo "Deploying to test at ${{ vars.APP_URL }}"

  deploy-production:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Deploying to production at ${{ vars.APP_URL }}"